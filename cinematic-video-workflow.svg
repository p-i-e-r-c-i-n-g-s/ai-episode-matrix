<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
  <title id="title">Cinematic Video Prompt Builder Workflow</title>
  <desc id="desc">Workflow from raw concept through image-base, director or movie mode, image-to-video, testing, diagnosis, and final sequence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:3}
      .mode{fill:#e0f2fe;stroke:#0369a1;stroke-width:3}
      .test{fill:#fef3c7;stroke:#b45309;stroke-width:3}
      .fix{fill:#fce7f3;stroke:#be185d;stroke-width:3}
      .done{fill:#dcfce7;stroke:#15803d;stroke-width:3}
      .decision{fill:#ede9fe;stroke:#6d28d9;stroke-width:3}
      text{font-family:Inter,Arial,sans-serif;fill:#0f172a}
      .label{font-size:24px;font-weight:600;text-anchor:middle}
      .small{font-size:20px;fill:#334155;text-anchor:middle}
      .line{fill:none;stroke:#475569;stroke-width:4;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:10 8;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1500" fill="white"/>
  <text x="800" y="55" font-size="34" font-weight="700" text-anchor="middle">Cinematic Video Prompt Builder</text>
  <text x="800" y="90" class="small">Concept → reference image → controlled motion → test → refinement</text>

  <rect x="600" y="125" width="400" height="70" rx="16" class="box"/><text x="800" y="168" class="label">Raw concept</text>
  <path d="M800 195 L800 230" class="line"/>
  <polygon points="800,230 950,300 800,370 650,300" class="decision"/><text x="800" y="294" class="label">Have a</text><text x="800" y="325" class="label">reference image?</text>

  <path d="M650 300 L300 300 L300 395" class="line"/><text x="450" y="282" class="small">No</text>
  <rect x="100" y="395" width="400" height="70" rx="16" class="mode"/><text x="300" y="438" class="label">Image-base mode</text>
  <path d="M300 465 L300 505" class="line"/>
  <rect x="100" y="505" width="400" height="70" rx="16" class="box"/><text x="300" y="548" class="label">Generate ChatGPT image</text>
  <path d="M300 575 L300 650 L800 650 L800 700" class="line"/>

  <path d="M950 300 L1300 300 L1300 395" class="line"/><text x="1125" y="282" class="small">Yes</text>
  <rect x="1100" y="395" width="400" height="70" rx="16" class="box"/><text x="1300" y="438" class="label">Select and inspect image</text>
  <path d="M1300 465 L1300 650 L800 650 L800 700" class="line"/>

  <rect x="550" y="700" width="500" height="70" rx="16" class="box"/><text x="800" y="743" class="label">Choose optional formal style</text>
  <path d="M800 770 L800 805" class="line"/>
  <polygon points="800,805 950,875 800,945 650,875" class="decision"/><text x="800" y="869" class="label">Director, movie,</text><text x="800" y="900" class="label">or user's intent?</text>

  <path d="M650 875 L300 875 L300 970" class="line"/><text x="450" y="857" class="small">Director</text>
  <rect x="100" y="970" width="400" height="70" rx="16" class="mode"/><text x="300" y="1013" class="label">Director mode</text>
  <path d="M300 1040 L300 1100 L800 1100 L800 1140" class="line"/>

  <path d="M950 875 L1300 875 L1300 970" class="line"/><text x="1125" y="857" class="small">Movie</text>
  <rect x="1100" y="970" width="400" height="70" rx="16" class="mode"/><text x="1300" y="1013" class="label">Movie mode</text>
  <path d="M1300 1040 L1300 1100 L800 1100 L800 1140" class="line"/>

  <path d="M800 945 L800 980" class="dash"/><text x="850" y="965" class="small">User's intent</text>
  <rect x="575" y="980" width="450" height="70" rx="16" class="box"/><text x="800" y="1023" class="label">Keep visual intent</text>
  <path d="M800 1050 L800 1100" class="line"/>

  <rect x="550" y="1140" width="500" height="70" rx="16" class="mode"/><text x="800" y="1183" class="label">Image-to-video mode</text>
  <path d="M800 1210 L800 1250" class="line"/>
  <rect x="550" y="1250" width="500" height="70" rx="16" class="test"/><text x="800" y="1293" class="label">Preserve reference + animate changes</text>
  <path d="M1050 1285 L1250 1285" class="line"/>
  <rect x="1250" y="1250" width="280" height="70" rx="16" class="test"/><text x="1390" y="1293" class="label">Short test clip</text>
  <path d="M1390 1320 L1390 1370" class="line"/>
  <polygon points="1390,1370 1510,1425 1390,1480 1270,1425" class="decision"/><text x="1390" y="1418" class="label">What</text><text x="1390" y="1447" class="label">failed?</text>
  <path d="M1270 1425 L1120 1425" class="line"/><text x="1190" y="1407" class="small">Identity / style / motion / camera</text>
  <rect x="850" y="1385" width="270" height="80" rx="16" class="fix"/><text x="985" y="1418" class="label">Targeted</text><text x="985" y="1447" class="label">refinement</text>
  <path d="M850 1425 L720 1425 L720 1285 L550 1285" class="line"/>
  <path d="M1390 1480 L1390 1490 L500 1490 L500 1465" class="dash"/>
  <rect x="100" y="1385" width="400" height="80" rx="16" class="done"/><text x="300" y="1418" class="label">Works: build sequence</text><text x="300" y="1447" class="small">Increase complexity gradually</text>
  <path d="M1270 1425 L500 1425" class="dash"/>
</svg>
